name: gotit
description: "Shares what you copy between your Android phone and your Windows PC."
publish_to: 'none'

# Local builds are 0.0.0. Release builds get their version from the release
# workflow (--build-name and --build-number); never edit it here by hand.
version: 0.0.0+0

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  # Inter 4.1, static weights subset to Latin (see docs/ARCHITECTURE.md, "Look").
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
