name: gotit
description: "Shares what you copy between your Android phone and your Windows PC."
publish_to: 'none'

# Local builds are 0.0.0. Release builds get their version from the release
# workflow (--build-name and --build-number); never edit it here by hand.
version: 0.0.0+0

environment:
  sdk: ^3.12.2

dependencies:
  basic_utils: ^5.8.2
  bonsoir: ^7.1.5
  crypto: ^3.0.8
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  tray_manager: ^0.5.3
  win32: ^6.4.0
  win32_registry: ^3.0.3
  window_manager: ^0.5.2
  windows_single_instance: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/tray/gotit.ico
  # Inter 4.1, static weights subset to Latin (see docs/ARCHITECTURE.md, "Look").
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
